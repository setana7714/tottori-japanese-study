<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>鳥取へ — 実践日本語</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#202a3d;--muted:#6d7687;
  --line:#e2e6ee;--accent:#397bdc;--soft:#f7f4ef;--warm:#fff8ec;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",sans-serif;
}
header{
  background:rgba(246,247,251,.96);padding:22px 20px 15px;
  border-bottom:1px solid var(--line);
}
h1{font-size:25px;margin:0 0 7px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.6}
main{max-width:720px;margin:auto;padding:16px 16px 110px}
.weekTabs,.dayTabs{
  display:flex;gap:8px;overflow:auto;padding:4px 0 12px;
}
button{
  font:inherit;border:1px solid var(--line);background:white;color:var(--ink);
  border-radius:18px;padding:10px 14px;cursor:pointer;
}
button.active{background:var(--ink);color:white;border-color:var(--ink)}
.progress{font-size:13px;color:var(--muted);margin:5px 2px 12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:25px;
  padding:24px 20px;box-shadow:0 2px 8px rgba(30,45,70,.04);
}
.category{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:18px}
.word{
  font-size:31px;font-weight:800;line-height:1.55;margin-bottom:4px;
}
.word rt{font-size:12px;font-weight:500}
.meaning{font-size:17px;color:#596171;margin-bottom:25px}
.label{font-size:12px;font-weight:700;color:#777;margin-bottom:9px}
.example{
  background:var(--soft);border-radius:18px;padding:22px 17px;
  font-size:22px;font-weight:750;line-height:2.15;color:#111827;
}
.example ruby{ruby-position:over}
.example rt{
  font-size:10px;font-weight:600;color:#555;letter-spacing:0;
}
.translation{
  margin-top:14px;padding:0 4px;font-size:15px;color:#606979;line-height:1.65;
}
.controls{
  display:grid;grid-template-columns:1fr auto 1fr;gap:9px;margin-top:18px;
}
.controls button{border-radius:14px;padding:13px 8px}
#prev{text-align:left}#next{text-align:right}
.star{color:var(--accent)}
.jump{
  margin-top:20px;background:white;border:1px solid var(--line);
  padding:16px;border-radius:18px;
}
.jumpTitle{font-size:13px;font-weight:700;margin-bottom:10px}
.jump select{
  width:100%;padding:11px;border:1px solid var(--line);
  border-radius:12px;background:white;font-size:15px;
}
.note{
  margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center
}
</style>
</head>
<body>
<header>
  <h1>鳥取へ — 実践日本語</h1>
  <div class="subtitle">3주 · 주 5일 · 하루 한 문장씩 넘기며 공부하기<br>교육 · 행정 · 독서 · 문화예술 · N1 · 음식 · 현장 일본어</div>
</header>

<main>
  <div class="weekTabs" id="weeks"></div>
  <div class="dayTabs" id="days"></div>
  <div class="progress" id="progress"></div>

  <section class="card">
    <div class="category" id="category"></div>
    <div class="word" id="word"></div>
    <div class="meaning" id="meaning"></div>

    <div class="label">例文 · 예문</div>
    <div class="example" id="example"></div>
    <div class="translation" id="translation"></div>

    <div class="controls">
      <button id="prev">← 이전</button>
      <button id="fav" class="star">☆ 다시 보기</button>
      <button id="next">다음 →</button>
    </div>
  </section>

  <div class="jump">
    <div class="jumpTitle">오늘 다른 문장 바로 보기</div>
    <select id="sentenceSelect"></select>
  </div>
  <div class="note">점수는 없습니다. 한 문장을 충분히 읽고 「다음」을 눌러 천천히 넘어가세요.</div>
</main>

<script>

const lessons=[

{c:"교육·행정",w:"教育委員会",wr:"きょういくいいんかい",m:"교육위원회",

{c:"N1 동사",w:"携わる",wr:"たずさわる",m:"종사하다·관여하다",

let week=0,day=0,pos=0;
let favorites=JSON.parse(localStorage.getItem("tottoriFav")||"[]");

const $=id=>document.getElementById(id);

function rubyWord(text,reading){
  return `<ruby>${text}<rt>${reading}</rt></ruby>`;
}

function buildTabs(){
  $("weeks").innerHTML="";
  for(let w=0;w<3;w++){
    let b=document.createElement("button");
    b.textContent=`${w+1}주차`;
    b.className=w===week?"active":"";
    b.onclick=()=>{week=w;day=0;pos=0;buildTabs();render()};
    $("weeks").appendChild(b);
  }

  $("days").innerHTML="";
  for(let d=0;d<5;d++){
    let b=document.createElement("button");
    b.textContent=`${d+1}일`;
    b.className=d===day?"active":"";
    b.onclick=()=>{day=d;pos=0;buildTabs();render()};
    $("days").appendChild(b);
  }
}

function globalIndex(){
  return week*25+day*5+pos;
}

function render(){
  const set=lessons[week*5+day];
  const x=set[pos];

  $("category").textContent=x.c;
  $("word").innerHTML=rubyWord(x.w,x.wr);
  $("meaning").textContent=x.m;
  $("example").innerHTML=x.j;
  $("translation").textContent=x.k;
  $("progress").textContent=`${week+1}주차 · ${day+1}일차 · 문장 ${pos+1} / ${set.length}`;

  const gi=globalIndex();
  $("fav").textContent=favorites.includes(gi)?"★ 다시 보기":"☆ 다시 보기";

  $("sentenceSelect").innerHTML="";
  set.forEach((q,i)=>{
    let o=document.createElement("option");
    o.value=i;
    o.textContent=`문장 ${i+1} · ${q.w}`;
    if(i===pos)o.selected=true;
    $("sentenceSelect").appendChild(o);
  });

  $("prev").disabled=(week===0&&day===0&&pos===0);
  $("next").textContent=(week===2&&day===4&&pos===set.length-1)?"처음으로 ↺":"다음 →";
  window.scrollTo({top:0,behavior:"smooth"});
}

function moveNext(){
  const set=lessons[week*5+day];
  if(pos<set.length-1){pos++}
  else if(day<4){day++;pos=0}
  else if(week<2){week++;day=0;pos=0}
  else{week=0;day=0;pos=0}
  buildTabs();render();
}

function movePrev(){
  if(pos>0){pos--}
  else if(day>0){day--;pos=lessons[week*5+day].length-1}
  else if(week>0){week--;day=4;pos=lessons[week*5+day].length-1}
  buildTabs();render();
}

$("next").onclick=moveNext;
$("prev").onclick=movePrev;

$("fav").onclick=()=>{
  const gi=globalIndex();
  if(favorites.includes(gi)) favorites=favorites.filter(v=>v!==gi);
  else favorites.push(gi);
  localStorage.setItem("tottoriFav",JSON.stringify(favorites));
  render();
};

$("sentenceSelect").onchange=e=>{
  pos=Number(e.target.value);render();
};

buildTabs();
render();
</script>
