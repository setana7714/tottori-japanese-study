<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鳥取へ — 実践日本語</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#263247;--muted:#70798a;--line:#e3e7ef;--accent:#5476a6;--soft:#edf3fb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{position:sticky;top:0;z-index:5;background:rgba(247,248,251,.96);border-bottom:1px solid var(--line);padding:16px}
h1{font-size:23px;margin:0}.sub{font-size:13px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:14px 14px 90px}
.toolbar{display:flex;gap:8px;overflow:auto;padding:10px 0}
button{cursor:pointer;touch-action:manipulation}
.toolbar button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;font-size:14px}
.toolbar button.active{background:var(--accent);color:white}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px rgba(48,65,91,.06)}
.tag{font-size:12px;color:var(--accent);font-weight:700}
.term{font-size:22px;font-weight:650}
.meaning{color:#555;font-size:14px}
.example{margin-top:8px;font-size:17px;line-height:2.25;background:#faf9f6;padding:11px 12px;border-radius:12px}
.item{padding:13px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px}
.star.on{background:#fff5cc}
.hidden{display:none!important}
.today{background:linear-gradient(135deg,#fff,#edf4ef)}
.note{font-size:13px;color:var(--muted)}
ruby rt{font-size:.55em;color:#555}
.no-ruby rt{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:6}
.bottom button{border:0;background:none;font-size:12px;padding:6px;color:#445}
</style>
</head>
<body>
<header>
<h1>鳥取へ — 実践日本語</h1>
<div class="sub">교육 · 비블리오 · 문화예술 · 돗토리 현장 일본어 · 점수 없음</div>
</header>

<main>
<div class="toolbar" id="cats"></div>

<section class="card today" data-cat="today">
<span class="tag">今日の15分</span>
<h2>오늘의 실전 일본어</h2>
<div id="daily"></div>
<div class="note">매일 다른 표현을 복습합니다. ☆를 누르면 다시 보기에 저장됩니다.</div>
</section>

<div id="content"></div>
</main>

<div class="bottom">
<button onclick="filterCat('today')">오늘</button>
<button onclick="filterCat('edu')">교육</button>
<button onclick="filterCat('tottori')">돗토리</button>
<button onclick="filterCat('field')">현장</button>
<button onclick="showFavs()">☆ 다시 보기</button>
</div>

<script>
const entries=[
['edu','교육·학교','教育委員会','きょういくいいんかい','교육위원회','教育委員会と学校が連携して、交流事業を進めています。'],
['edu','교육·학교','教育課程','きょういくかてい','교육과정','学校の教育課程に文化芸術活動をどのように位置付けていますか。'],
['edu','교육·학교','学習指導','がくしゅうしどう','학습지도','生徒の主体性を大切にした学習指導が印象的でした。'],
['edu','교육·학교','授業改善','じゅぎょうかいぜん','수업 개선','授業改善のために、先生方はどのような協議をされていますか。'],
['edu','교육행정','教育行政','きょういくぎょうせい','교육행정','私は江原道教育庁で文化芸術教育を担当しています。'],

['verb','교육 동사','促す','うながす','촉진하다·유도하다','生徒同士の対話を促すことが、今回の交流の大切な目的です。'],
['verb','교육 동사','取り組む','とりくむ','임하다·추진하다','江原道では文化芸術教育の充実に取り組んでいます。'],
['verb','교육 동사','踏まえる','ふまえる','감안하다·토대로 하다','今回の交流で学んだことを踏まえて、今後の事業に生かしたいです。'],

['adj','형용사·형용동사','望ましい','のぞましい','바람직하다','生徒にとってどのような交流の形が望ましいか、一緒に考えたいです。'],
['adj','형용사·형용동사','円滑な','えんかつな','원활한','円滑な交流のために、事前に日程を確認しました。'],

['biblio','비블리오·독서','質疑応答','しつぎおうとう','질의응답','発表の後の質疑応答も、ビブリオバトルの大切な学びだと思います。'],
['biblio','비블리오·독서','推薦図書','すいせんとしょ','추천도서','生徒が自分で推薦図書を選ぶ過程も大切にしています。'],

['tottori','돗토리','鳥取県教育委員会','とっとりけんきょういくいいんかい','돗토리현교육위원회','鳥取県教育委員会の皆様にお招きいただき、心より感謝申し上げます。'],
['tottori','돗토리','鳥取東高等学校','とっとりひがしこうとうがっこう','돗토리히가시고등학교','鳥取東高等学校で生徒同士が交流できることを楽しみにしています。'],
['tottori','돗토리','鳥取敬愛高等学校','とっとりけいあいこうとうがっこう','돗토리게이아이 고등학교','鳥取敬愛高等学校で文化発表の機会をいただき、ありがとうございます。'],
['tottori','돗토리','鳥取県立図書館','とっとりけんりつとしょかん','돗토리현립도서관','図書館の皆様が韓国と江原道に関心を持ってくださり、本当にありがたく思っています。'],
['tottori','돗토리','倉吉','くらよし','구라요시','倉吉で行われるビブリオバトルをとても楽しみにしています。'],

['art','문화예술','韓国舞踊','かんこくぶよう','한국무용','江原芸術高等学校の生徒が韓国舞踊を披露します。'],
['art','문화예술','音響設備','おんきょうせつび','음향설비','会場の音響設備について事前に確認させてください。'],
['art','문화예술','文化芸術教育','ぶんかげいじゅつきょういく','문화예술교육','文化芸術教育を通して、生徒の感性と創造性を育てたいと考えています。'],

['field','현장 표현','お招きいただき、ありがとうございます。','おまねきいただき、ありがとうございます。','초대해 주셔서 감사합니다.','本日は私たちをお招きいただき、本当にありがとうございます。'],
['field','현장 표현','貴重な機会','きちょうなきかい','귀중한 기회','このような貴重な交流の機会を設けていただき、心より感謝申し上げます。'],
['field','현장 표현','弁論大会','べんろんたいかい','웅변대회','弁論大会も見学できると伺い、とても楽しみにしています。'],
['field','현장 표현','理事会','りじかい','이사회','学校法人の理事会は、学校運営にどのように関わっていますか。'],

['kishida','기시다상 표현','お言葉に甘えて','おことばにあまえて','말씀하신 호의에 기대어','お言葉に甘えて、火曜日の夕食については改めてご連絡します。'],
['kishida','기시다상 표현','気が引ける','きがひける','마음이 쓰이다','何度もご連絡するのは少し気が引けるところです。'],
['kishida','기시다상 표현','急がば回れ','いそがばまわれ','급할수록 돌아가라','お互い「急がば回れ」で、焦らず進めていきましょう。']
];

const catNames={
today:'오늘',
edu:'교육·학교',
verb:'동사',
adj:'형용사',
biblio:'비블리오',
tottori:'돗토리',
art:'문화예술',
field:'현장 표현',
kishida:'기시다상 표현'
};

function rw(t,r){
return '<ruby>'+t+'<rt>'+r+'</rt></ruby>';
}

function card(e,i){
return `<section class="card entry" data-cat="${e[0]}" data-id="${i}">
<span class="tag">${e[1]}</span>
<div class="item">
<div class="term">${rw(e[2],e[3])}</div>
<div class="meaning">${e[4]}</div>
<div class="example">${e[5]}</div>
<div class="actions"><button class="star" onclick="toggleFav(${i})">☆ 다시 보기</button></div>
</div></section>`;
}

document.getElementById('content').innerHTML=entries.map(card).join('');

document.getElementById('cats').innerHTML=
`<button onclick="showAll(this)">전체</button>`+
Object.entries(catNames).map(([k,v])=>`<button onclick="filterCat('${k}',this)">${v}</button>`).join('')+
`<button onclick="showFavs(this)">☆ 다시 보기</button>
<button onclick="toggleRuby(this)">후리가나 ON</button>`;

let rubyOn=true;

function toggleRuby(btn){
rubyOn=!rubyOn;
document.body.classList.toggle('no-ruby',!rubyOn);
btn.textContent='후리가나 '+(rubyOn?'ON':'OFF');
}

function showAll(btn){
document.querySelector('.today').classList.remove('hidden');
document.querySelectorAll('.entry').forEach(x=>x.classList.remove('hidden'));
active(btn);
}

function filterCat(cat,btn){
document.querySelectorAll('.entry').forEach(x=>{
x.classList.toggle('hidden',x.dataset.cat!==cat);
});
document.querySelector('.today').classList.toggle('hidden',cat!=='today');
active(btn);
window.scrollTo(0,0);
}

function active(btn){
document.querySelectorAll('#cats button').forEach(b=>b.classList.remove('active'));
if(btn)btn.classList.add('active');
}

function getFavs(){
return JSON.parse(localStorage.getItem('tottoriFavs')||'[]');
}

function toggleFav(i){
let f=getFavs();
f=f.includes(i)?f.filter(x=>x!==i):[...f,i];
localStorage.setItem('tottoriFavs',JSON.stringify(f));
syncStars();
}

function syncStars(){
let f=getFavs();
document.querySelectorAll('.entry').forEach(x=>{
let on=f.includes(+x.dataset.id);
let b=x.querySelector('.star');
b.classList.toggle('on',on);
b.textContent=on?'★ 저장됨':'☆ 다시 보기';
});
}

function showFavs(btn){
let f=getFavs();
document.querySelector('.today').classList.add('hidden');
document.querySelectorAll('.entry').forEach(x=>{
x.classList.toggle('hidden',!f.includes(+x.dataset.id));
});
active(btn);
window.scrollTo(0,0);
}

function daily(){
let d=Math.floor(Date.now()/86400000);
let ids=[];
for(let i=0;i<6;i++) ids.push((d*7+i*11)%entries.length);

document.getElementById('daily').innerHTML=
ids.map(i=>{
let e=entries[i];
return `<div class="item">
<div class="term">${rw(e[2],e[3])}</div>
<div class="meaning">${e[4]}</div>
<div class="example">${e[5]}</div>
</div>`;
}).join('');
}

daily();
syncStars();
filterCat('today');
</script>
</body>
</html>
