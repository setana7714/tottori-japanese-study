<title>鳥取へ — 実践日本語</title>

<style>
:root{
  --bg:#f4f1ec;
  --card:#fff;
  --ink:#172033;
  --muted:#687080;
  --line:#e3ded6;
  --accent:#496d67;
  --soft:#f3eee7;
  --gold:#9b6b35;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:5;
  background:#f4f1ecf2;
  border-bottom:1px solid var(--line);
  padding:15px 14px 9px;
}
.head{
  max-width:720px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
h1{font-size:20px;margin:0}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
button,select{font:inherit}
button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:9px 11px;
  color:var(--ink);
}
.toggle{font-size:12px;white-space:nowrap}
main{max-width:720px;margin:auto;padding:13px 13px 90px}
.row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:9px;
}
.row::-webkit-scrollbar{display:none}
.active{
  background:var(--accent)!important;
  color:#fff!important;
  border-color:var(--accent)!important;
}
.title{font-size:16px;font-weight:800;margin:5px 2px}
.prog{font-size:12px;color:var(--muted);margin:5px 2px 10px}
.bar{
  height:6px;
  background:#e1ded8;
  border-radius:9px;
  overflow:hidden;
  margin-bottom:13px;
}
.bar div{height:100%;background:var(--accent)}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:23px;
  padding:20px 17px;
  box-shadow:0 3px 13px #1820300a;
}
.cat{
  font-size:12px;
  font-weight:800;
  color:var(--accent);
  margin-bottom:12px;
}
.word{font-size:29px;font-weight:850;line-height:1.8}
.word rt{font-size:11px}
.meaning{font-size:15px;color:#596170;margin-bottom:20px}
.lab{font-size:11px;font-weight:800;color:#777;margin-bottom:7px}
.ex{
  background:var(--soft);
  border-radius:16px;
  padding:17px 14px;
  font-size:20px;
  font-weight:800;
  line-height:2.3;
}
.ex rt{font-size:9px;color:#555}
.ko{
  font-size:14px;
  color:#5e6674;
  line-height:1.6;
  padding:11px 2px 2px;
}
.actions{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:7px;
  margin-top:15px;
}
.actions button{padding:12px 7px}
.fav{color:var(--gold);font-weight:800}
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:13px;
  margin-top:12px;
}
.panel b{font-size:12px}
select{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
}
.hide{display:none}
.favitem{
  width:100%;
  text-align:left;
  margin:5px 0;
  line-height:1.5;
}
.noRuby rt{display:none}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fffffffa;
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  z-index:9;
}
.bottomin{
  max-width:720px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.note{text-align:center;font-size:11px;color:#7b7f88;margin-top:12px}
</style>
</head>

<div class="note">

</main>

<div class="bottom">

`${R(w,r)}という${R("表現","ひょうげん")}を、${R("今回","こんかい")}の${R("交流","こうりゅう")}で${R("自然","しぜん")}に${R("使","つか")}えるようにしておきたいです。`;

const k=
`‘${m}’이라는 표현을 이번 교류에서 자연스럽게 사용할 수 있도록 익혀 두고 싶습니다.`;

return [j,k];

}

const DAYS=raw.map((d,di)=>({

title:
`${Math.floor(di/5)+1}주차 ${di%5+1}일 · ${d[0]}`,

cards:d[1].map(s=>{

let [w,r,m]=s.split("|");

let q=special[w]||generic(w,r,m);

return{
w:w,
r:r,
m:m,
j:q[0],
k:q[1],
c:d[0]
};

})

}));

let di=+(localStorage.getItem("tj_day")||0);
let ci=+(localStorage.getItem("tj_card")||0);

let rubyOn=
localStorage.getItem("tj_ruby")!=="off";

let favs=
JSON.parse(localStorage.getItem("tj_favs")||"[]");

const $=id=>document.getElementById(id);

function key(){
return `${di}:${ci}`;
}

function tabs(){

$("weeks").innerHTML="";

for(let w=0;w<3;w++){

let b=document.createElement("button");

b.textContent=`${w+1}주차`;

b.className=
Math.floor(di/5)===w ? "active" : "";

b.onclick=()=>{

di=w*5;
ci=0;

tabs();
render();

};

$("weeks").appendChild(b);

}

$("dates").innerHTML="";

let base=Math.floor(di/5)*5;

for(let i=0;i<5;i++){

let b=document.createElement("button");

b.textContent=`${i+1}일`;

b.className=
di===base+i ? "active" : "";

b.onclick=()=>{

di=base+i;
ci=0;

tabs();
render();

};

$("dates").appendChild(b);

}

}

function render(){

const x=DAYS[di].cards[ci];

$("ttl").textContent=DAYS[di].title;
$("cat").textContent=x.c;

$("word").innerHTML=
R(x.w,x.r);

$("mean").textContent=x.m;

$("ex").innerHTML=x.j;
$("ko").textContent=x.k;

$("prog").textContent=
`전체 ${di*8+ci+1} / 120 · 오늘 ${ci+1} / 8`;

$("bar").style.width=
`${((di*8+ci+1)/120)*100}%`;

$("star").textContent=
favs.includes(key())
? "★ 저장됨"
: "☆ 다시 보기";

$("jump").innerHTML=
DAYS[di].cards.map((x,i)=>
`<option value="${i}" ${i===ci?"selected":""}>
${i+1}. ${x.w} · ${x.m}
</option>`
).join("");

document.body.classList.toggle(
"noRuby",
!rubyOn
);

$("rubyBtn").textContent=
`후리가나 ${rubyOn?"ON":"OFF"}`;

localStorage.setItem("tj_day",di);
localStorage.setItem("tj_card",ci);

}

function go(n){

ci+=n;

if(ci>7){

ci=0;
di++;

if(di>14)di=0;

}

if(ci<0){

di--;

if(di<0)di=14;

ci=7;

}

tabs();
render();

window.scrollTo(0,0);

}

$("next").onclick=()=>go(1);
$("prev").onclick=()=>go(-1);

$("jump").onchange=e=>{

ci=Number(e.target.value);
render();

};

$("rubyBtn").onclick=()=>{

rubyOn=!rubyOn;

localStorage.setItem(
"tj_ruby",
rubyOn ? "on" : "off"
);

render();

};

$("star").onclick=()=>{

const k=key();

if(favs.includes(k)){

favs=favs.filter(x=>x!==k);

}else{

favs.push(k);

}

localStorage.setItem(
"tj_favs",
JSON.stringify(favs)
);

render();

};

function showStudy(){

$("study").classList.remove("hide");
$("review").classList.add("hide");

$("home").classList.add("active");
$("reviews").classList.remove("active");

}

$("home").onclick=showStudy;

$("reviews").onclick=()=>{

$("study").classList.add("hide");
$("review").classList.remove("hide");

$("home").classList.remove("active");
$("reviews").classList.add("active");

const box=$("favlist");

box.innerHTML="";

if(!favs.length){

box.innerHTML=
"<div style='color:#777;margin-top:10px'>아직 저장한 표현이 없습니다.</div>";

return;

}

favs.forEach(v=>{

const [d,c]=v.split(":").map(Number);

const x=DAYS[d].cards[c];

const b=document.createElement("button");

b.className="favitem";

b.innerHTML=
`<b>${x.w}</b> · ${x.m}<br>
<small>${DAYS[d].title}</small>`;

b.onclick=()=>{

di=d;
ci=c;

tabs();
render();
showStudy();

};

box.appendChild(b);

});

};

tabs();
render();

</script>

</body>
</html>
